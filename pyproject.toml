[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrica-context-fabric"
version = "0.4.0"
description = "Independent evidence-oriented context governance kernel and OpenViking conformance probes"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
fcf = "fcf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
