name: P11 isolated native core-initialization diagnostic (NOT server certification)
on:
  pull_request:
    paths:
      - "scripts/p11_core_init_probe.py"
      - "tests/test_p11_core_init_probe.py"
      - ".github/workflows/p11-core-init-diagnostic.yml"
      - "scripts/p07_import_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-real-core:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify offline fail-closed contract
        run: python -m unittest discover -s tests -p 'test_p11_core_init_probe.py' -v
      - name: Install uv
        run: python -m pip install "uv>=0.8,<1"
      - name: Checkout exact OpenViking source revision
        env:
          PIN: 20f9c11362ad16193b0daa4a414e1095061af427
        run: |
          git clone --filter=blob:none https://github.com/volcengine/OpenViking.git "$RUNNER_TEMP/openviking-p11-core"
          git -C "$RUNNER_TEMP/openviking-p11-core" checkout --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/openviking-p11-core" rev-parse HEAD)" = "$PIN"
      - name: Install genuine pinned upstream package
        run: uv pip install --python "$(command -v python)" -e "$RUNNER_TEMP/openviking-p11-core"
      - name: Invoke direct actual OpenVikingService.initialize in disposable workspace
        run: |
          python scripts/p11_core_init_probe.py --execute \
            --upstream-path "$RUNNER_TEMP/openviking-p11-core"
      - name: Preserve security and acceptance limits
        if: always()
        run: |
          echo 'UPSTREAM_CORE_SERVICE=OBSERVATION_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'C1_CONFIG=PASS_ON_PREVIOUS_HTTP_CAMPAIGN' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_SERVER_HTTP=HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo 'AUTH_AND_TWO_ACCOUNT_ACL=HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo 'REAL_MODEL_PROVIDER=HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION=HOLD' >> "$GITHUB_STEP_SUMMARY"
