name: P09 offline observation contract (NOT genuine OpenViking)
on: [push, pull_request]
jobs:
  offline-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: P09 fail-closed observation tests only
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_p09_gate.py' -v
      - name: Publish bounded evidence scope
        run: |
          echo 'P09_OFFLINE_CONTRACT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'NATIVE_OPENVIKING=HOLD (no upstream server)' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_AUTHORIZATION=HOLD' >> "$GITHUB_STEP_SUMMARY"
